name: Deploy doctors.joyzen.in

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Hostinger via rsync/SSH
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr --delete
          path: out/
          remote_path: domains/joyzen.in/public_html/doctors/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
